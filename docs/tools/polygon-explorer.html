<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habitat — Explorador de Arranjos Poligonais</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:#0d0d0d;color:#ddd;display:flex;height:100vh;overflow:hidden}
.panel{width:330px;min-width:330px;padding:20px;background:#131313;border-right:1px solid #1e1e1e;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.panel h1{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.panel .sub{font-size:11px;color:#555;margin-top:2px}
.grp{display:flex;flex-direction:column;gap:5px}
.grp label{font-size:10px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.grp label .v{font-size:12px;font-weight:700;color:#6bb;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:#222;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#6bb;cursor:pointer}
select{padding:7px 10px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:5px;color:#ddd;font-size:12px}
.sides-cfg{display:flex;gap:3px;flex-wrap:wrap}
.sb{width:38px;height:30px;border:1px solid #2a2a2a;border-radius:4px;background:#1a1a1a;color:#555;font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sb.ws{border-color:#4a9;color:#4a9;background:rgba(68,170,153,.08)}
.sb.pt{border-color:#b80;color:#b80;background:rgba(184,136,0,.08)}
.sb.op{border-color:#444;color:#777;background:rgba(100,100,100,.05)}
.metrics{border-top:1px solid #1e1e1e;padding-top:14px}
.metrics h2{font-size:10px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.mr{display:flex;justify-content:space-between;padding:2px 0;font-size:11px}
.mr .k{color:#666}.mr .v{color:#bbb;font-weight:500;font-variant-numeric:tabular-nums}
.mr .v.hl{color:#6bb;font-weight:700}
.legend{border-top:1px solid #1e1e1e;padding-top:10px;display:flex;flex-direction:column;gap:3px}
.li{display:flex;align-items:center;gap:7px;font-size:10px;color:#777}
.ls{width:12px;height:12px;border-radius:2px;flex-shrink:0}
.cw{flex:1;display:flex;align-items:center;justify-content:center}
#svg{width:100%;height:100%}
.sep{border:none;border-top:1px solid #1e1e1e;margin:4px 0}
</style>
</head>
<body>
<div class="panel">
  <div>
    <h1>Habitat</h1>
    <div class="sub">Explorador de Arranjos Poligonais</div>
  </div>
  <div class="grp">
    <label>Polígono</label>
    <select id="selN">
      <option value="5">Pentágono (5 lados, 108°)</option>
      <option value="6" selected>Hexágono (6 lados, 120°)</option>
      <option value="7">Heptágono (7 lados, ~128,6°)</option>
      <option value="8">Octógono (8 lados, 135°)</option>
    </select>
  </div>
  <div class="grp">
    <label>Comprimento do lado <span class="v" id="vS">1.00 m</span></label>
    <input type="range" id="rS" min="0.5" max="3" step="0.05" value="1">
  </div>
  <div class="grp">
    <label>Profundidade da bancada <span class="v" id="vD">0.50 m</span></label>
    <input type="range" id="rD" min="0" max="1.5" step="0.05" value="0.5">
  </div>
  <div class="grp">
    <label>Abertura entre módulos <span class="v" id="vG">0.00 m</span></label>
    <input type="range" id="rG" min="0" max="1" step="0.05" value="0">
  </div>
  <div class="grp">
    <label>Tipo de cada lado (clique p/ alternar)</label>
    <div class="sides-cfg" id="sCfg"></div>
  </div>
  <div class="legend">
    <div class="li"><div class="ls" style="background:rgba(68,170,153,.6)"></div>Workstation (bancada)</div>
    <div class="li"><div class="ls" style="background:rgba(184,136,0,.6)"></div>Partition (fechamento)</div>
    <div class="li"><div class="ls" style="background:rgba(80,80,80,.4)"></div>Abertura / entrada</div>
    <div class="li"><div class="ls" style="background:rgba(255,255,255,.25)"></div>Pessoa sentada (top view)</div>
  </div>
  <div class="metrics" id="met"></div>
</div>
<div class="cw"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const TYPES=['ws','pt','op'],TL={ws:'W',pt:'P',op:'\u2014'};
let ST=[];
const $=id=>document.getElementById(id);
const el={svg:$('svg'),selN:$('selN'),rS:$('rS'),rD:$('rD'),rG:$('rG'),vS:$('vS'),vD:$('vD'),vG:$('vG'),sCfg:$('sCfg'),met:$('met')};
function P(){return{n:+el.selN.value,s:+el.rS.value,d:+el.rD.value,g:+el.rG.value}}
function geo(n,s){const R=s/(2*Math.sin(Math.PI/n)),a=s/(2*Math.tan(Math.PI/n));return{R,a,area:n*s*a/2,ang:(n-2)*180/n}}

function initST(){
  const n=+el.selN.value;ST=[];
  for(let i=0;i<n;i++){
    if(i<2)ST.push('ws');
    else if(i===n-1)ST.push('op');
    else ST.push('pt');
  }
  renderBtns();
}

function renderBtns(){
  el.sCfg.innerHTML='';
  ST.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='sb '+t;b.textContent=i+1;
    b.title=`Lado ${i+1}: ${t==='ws'?'Workstation':t==='pt'?'Partition':'Abertura'}`;
    b.onclick=()=>{const ix=TYPES.indexOf(ST[i]);ST[i]=TYPES[(ix+1)%3];renderBtns();draw()};
    el.sCfg.appendChild(b);
  });
}

function draw(){
  const{n,s,d,g}=P(),G=geo(n,s);
  el.vS.textContent=s.toFixed(2)+' m';
  el.vD.textContent=d.toFixed(2)+' m';
  el.vG.textContent=g.toFixed(2)+' m';

  const svg=el.svg,rect=svg.getBoundingClientRect();
  const sz=Math.min(rect.width||800,rect.height||800);
  svg.setAttribute('viewBox',`0 0 ${sz} ${sz}`);
  const cx=sz/2,cy=sz/2,pad=sz*.12,sc=(sz/2-pad)/(G.R*1.15);
  let h='';

  // grid
  for(let r=.5;r<=G.R*1.4;r+=.5){
    const rp=r*sc;
    h+=`<circle cx="${cx}" cy="${cy}" r="${rp}" fill="none" stroke="#181818" stroke-width=".5"/>`;
    if(r%1===0)h+=`<text x="${cx+3}" y="${cy-rp+11}" fill="#252525" font-size="9" font-family="system-ui">${r.toFixed(0)}m</text>`;
  }

  // vertices
  const V=[],iv=d>0&&G.a>d,dApo=d>0?Math.max(0,G.a-d):0,dR=dApo/Math.cos(Math.PI/n),IV=[];
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+2*Math.PI*i/n;
    V.push({x:cx+G.R*sc*Math.cos(a),y:cy+G.R*sc*Math.sin(a)});
    if(iv)IV.push({x:cx+dR*sc*Math.cos(a),y:cy+dR*sc*Math.sin(a)});
  }

  // dashed outline
  h+=`<polygon points="${V.map(v=>v.x.toFixed(1)+','+v.y.toFixed(1)).join(' ')}" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="4,4"/>`;
  if(iv)h+=`<polygon points="${IV.map(v=>v.x.toFixed(1)+','+v.y.toFixed(1)).join(' ')}" fill="none" stroke="#1a1a1a" stroke-width=".5" stroke-dasharray="2,4"/>`;

  // free space circle
  if(iv){
    const fr=dApo*sc;
    h+=`<circle cx="${cx}" cy="${cy}" r="${fr}" fill="rgba(68,170,153,.03)" stroke="rgba(68,170,153,.12)" stroke-width=".5" stroke-dasharray="3,3"/>`;
  }

  // modules
  for(let i=0;i<n;i++){
    const t=ST[i]||'ws',v1=V[i],v2=V[(i+1)%n];
    const dx=v2.x-v1.x,dy=v2.y-v1.y,len=Math.sqrt(dx*dx+dy*dy),ux=dx/len,uy=dy/len;
    const gp=g*sc,el2=len-gp*2;
    if(el2<=0)continue;
    const s1={x:v1.x+ux*gp,y:v1.y+uy*gp},e1={x:v2.x-ux*gp,y:v2.y-uy*gp};
    const gf=gp/len;

    if(t==='op'){
      h+=`<line x1="${s1.x.toFixed(1)}" y1="${s1.y.toFixed(1)}" x2="${e1.x.toFixed(1)}" y2="${e1.y.toFixed(1)}" stroke="#333" stroke-width="1" stroke-dasharray="3,5"/>`;
      const mx=(s1.x+e1.x)/2,my=(s1.y+e1.y)/2;
      const ma=-Math.PI/2+2*Math.PI*i/n+Math.PI/n;
      h+=`<text x="${(mx+Math.cos(ma)*16).toFixed(1)}" y="${(my+Math.sin(ma)*16).toFixed(1)}" fill="#3a3a3a" font-size="8" font-family="system-ui" text-anchor="middle">entrada</text>`;
      continue;
    }

    if(t==='ws'){
      h+=`<line x1="${s1.x.toFixed(1)}" y1="${s1.y.toFixed(1)}" x2="${e1.x.toFixed(1)}" y2="${e1.y.toFixed(1)}" stroke="#4a9" stroke-width="2.5"/>`;
      if(iv){
        const i1=IV[i],i2=IV[(i+1)%n];
        const is1={x:i1.x+(i2.x-i1.x)*gf,y:i1.y+(i2.y-i1.y)*gf};
        const ie1={x:i2.x-(i2.x-i1.x)*gf,y:i2.y-(i2.y-i1.y)*gf};
        h+=`<polygon points="${s1.x.toFixed(1)},${s1.y.toFixed(1)} ${e1.x.toFixed(1)},${e1.y.toFixed(1)} ${ie1.x.toFixed(1)},${ie1.y.toFixed(1)} ${is1.x.toFixed(1)},${is1.y.toFixed(1)}" fill="rgba(160,120,60,.2)" stroke="rgba(160,120,60,.4)" stroke-width=".5"/>`;
        h+=`<line x1="${is1.x.toFixed(1)}" y1="${is1.y.toFixed(1)}" x2="${ie1.x.toFixed(1)}" y2="${ie1.y.toFixed(1)}" stroke="rgba(68,170,153,.4)" stroke-width="1"/>`;
        // person
        const ma2=-Math.PI/2+2*Math.PI*i/n+Math.PI/n;
        const iwx=-(Math.cos(ma2)),iwy=-(Math.sin(ma2));
        const pmx=(is1.x+ie1.x)/2,pmy=(is1.y+ie1.y)/2;
        const pr=.17*sc,px=pmx+iwx*pr*1.8,py=pmy+iwy*pr*1.8;
        h+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${pr.toFixed(1)}" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.3)" stroke-width=".8"/>`;
        // facing dot (toward screen = outward)
        h+=`<circle cx="${(px-iwx*pr*.6).toFixed(1)}" cy="${(py-iwy*pr*.6).toFixed(1)}" r="${(pr*.25).toFixed(1)}" fill="rgba(255,255,255,.3)"/>`;
      }
    } else {
      h+=`<line x1="${s1.x.toFixed(1)}" y1="${s1.y.toFixed(1)}" x2="${e1.x.toFixed(1)}" y2="${e1.y.toFixed(1)}" stroke="rgba(184,136,0,.25)" stroke-width="7"/>`;
      h+=`<line x1="${s1.x.toFixed(1)}" y1="${s1.y.toFixed(1)}" x2="${e1.x.toFixed(1)}" y2="${e1.y.toFixed(1)}" stroke="#b80" stroke-width="2.5"/>`;
    }
  }

  // center
  h+=`<circle cx="${cx}" cy="${cy}" r="2.5" fill="#333"/>`;

  // scale bar
  const barY=sz-25,barX=25,barL=sc;
  h+=`<line x1="${barX}" y1="${barY}" x2="${barX+barL}" y2="${barY}" stroke="#444" stroke-width="1.5"/>`;
  h+=`<line x1="${barX}" y1="${barY-3}" x2="${barX}" y2="${barY+3}" stroke="#444" stroke-width="1"/>`;
  h+=`<line x1="${barX+barL}" y1="${barY-3}" x2="${barX+barL}" y2="${barY+3}" stroke="#444" stroke-width="1"/>`;
  h+=`<text x="${barX+barL/2}" y="${barY-7}" fill="#444" font-size="9" font-family="system-ui" text-anchor="middle">1 m</text>`;

  // side length label on side 0
  const l0m={x:(V[0].x+V[1].x)/2,y:(V[0].y+V[1].y)/2};
  const l0a=-Math.PI/2+Math.PI/n;
  h+=`<text x="${(l0m.x+Math.cos(l0a)*18).toFixed(1)}" y="${(l0m.y+Math.sin(l0a)*18).toFixed(1)}" fill="#444" font-size="9" font-family="system-ui" text-anchor="middle">${s.toFixed(2)} m</text>`;

  // diameter
  const dia=G.R*2,di=Math.floor(n/2);
  h+=`<line x1="${V[0].x.toFixed(1)}" y1="${V[0].y.toFixed(1)}" x2="${V[di].x.toFixed(1)}" y2="${V[di].y.toFixed(1)}" stroke="#1e1e1e" stroke-width=".5" stroke-dasharray="2,3"/>`;
  h+=`<text x="${((V[0].x+V[di].x)/2+10).toFixed(1)}" y="${((V[0].y+V[di].y)/2).toFixed(1)}" fill="#333" font-size="9" font-family="system-ui">\u2300 ${dia.toFixed(2)} m</text>`;

  // bench→center label
  if(iv){
    const bca=-Math.PI/2+Math.PI/n;
    const bcx=cx+Math.cos(bca)*dApo*sc*.5;
    const bcy=cy+Math.sin(bca)*dApo*sc*.5;
    h+=`<text x="${bcx.toFixed(1)}" y="${bcy.toFixed(1)}" fill="rgba(68,170,153,.35)" font-size="8" font-family="system-ui" text-anchor="middle">${dApo.toFixed(2)}m</text>`;
  }

  svg.innerHTML=h;

  // metrics
  const tanN=Math.tan(Math.PI/n);
  const benchPerSide=tanN*(2*G.a*d-d*d);
  const wsC=ST.filter(t=>t==='ws').length;
  const ptC=ST.filter(t=>t==='pt').length;
  const opC=ST.filter(t=>t==='op').length;
  const totalBench=wsC*benchPerSide;
  const innerArea=n>0&&iv?n*dApo*dApo*tanN:G.area;
  const freeArea=G.area-totalBench;
  const effMod=Math.max(0,s-g*2);

  // distance bench→opposite
  let benchToOpposite='—';
  if(iv){
    if(n%2===0)benchToOpposite=(dApo+G.a).toFixed(2)+' m';
    else benchToOpposite=(dApo+G.R).toFixed(2)+' m';
  }

  el.met.innerHTML=`
    <h2>Geometria</h2>
    <div class="mr"><span class="k">Ângulo interno</span><span class="v">${G.ang.toFixed(1)}°</span></div>
    <div class="mr"><span class="k">Circunraio (R)</span><span class="v">${G.R.toFixed(2)} m</span></div>
    <div class="mr"><span class="k">Apótema (a)</span><span class="v">${G.a.toFixed(2)} m</span></div>
    <div class="mr"><span class="k">Diâmetro</span><span class="v hl">${dia.toFixed(2)} m</span></div>
    <div class="mr"><span class="k">Área total</span><span class="v hl">${G.area.toFixed(2)} m²</span></div>
    ${d>0?`
    <hr class="sep">
    <h2>Com bancadas</h2>
    <div class="mr"><span class="k">Área das bancadas</span><span class="v">${totalBench.toFixed(2)} m²</span></div>
    <div class="mr"><span class="k">Área livre</span><span class="v hl">${freeArea.toFixed(2)} m²</span></div>
    <div class="mr"><span class="k">Bancada → centro</span><span class="v hl">${dApo.toFixed(2)} m</span></div>
    <div class="mr"><span class="k">Bancada → oposto</span><span class="v">${benchToOpposite}</span></div>
    `:''}
    <hr class="sep">
    <h2>Módulos</h2>
    <div class="mr"><span class="k">Largura útil (c/ gap)</span><span class="v">${effMod.toFixed(2)} m</span></div>
    <div class="mr"><span class="k">Workstations</span><span class="v" style="color:#4a9">${wsC}</span></div>
    <div class="mr"><span class="k">Partitions</span><span class="v" style="color:#b80">${ptC}</span></div>
    <div class="mr"><span class="k">Aberturas</span><span class="v" style="color:#777">${opC}</span></div>
  `;
}

[el.rS,el.rD,el.rG,el.selN].forEach(e=>e.addEventListener('input',()=>{if(e===el.selN)initST();draw()}));
window.addEventListener('resize',draw);
initST();
requestAnimationFrame(draw);
</script>
</body>
</html>
